name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Verification
        run: npm test

      - name: Build Application Package
        run: npm run pack

      - name: Create Portable Zip & Checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "DocProps-Studio-${tag}-windows-x64.zip"
          Compress-Archive -Path "dist/DocProps Studio-win32-x64/*" -DestinationPath $zipName
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DocProps Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DocProps-Studio-*-windows-x64.zip
            DocProps-Studio-*-windows-x64.zip.sha256

